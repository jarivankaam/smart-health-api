name: Build, Test and Deploy a .NET Core WebApi to Azure App Service

env: # Change these settings when you need to
  ARTIFACT_NAME: WebApi
  DOTNET_CORE_VERSION: 9.0.x
  PUBLISH_DIRECTORY: "./out/publish"
on:
  push:
    branches:
      - main
      - deployment 
      - master

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

jobs:
  check: # checking if the secrets exist (src: https://stackoverflow.com/questions/72925899/github-actions-detect-if-secret-exists)
      runs-on: ubuntu-latest
      steps:
        - name: "Check if AZURE_WEBAPP_NAME secret exists"
          env: 
            super_secret: ${{ secrets.AZURE_WEBAPP_NAME }}
          if: ${{ env.super_secret == '' }}
          run: 'echo "echo the secret \"AZURE_WEBAPP_NAME\" has not been made; echo please go to \"settings \> Actions secrets and variables \> actions\" to create it"; exit 1;'
    
        - name: "Check if AZURE_WEBAPP_PUBLISH_PASSWORD secret exists"
          env: 
            super_secret: ${{ secrets.AZURE_WEBAPP_PUBLISH_PASSWORD }}
          if: ${{ env.super_secret == '' }}
          run: 'echo "echo the secret \"AZURE_WEBAPP_PUBLISH_PASSWORD\" has not been made; echo please go to \"settings \> Actions secrets and variables \> actions \" to create it"; exit 1;'
    
        - name: "Check if AZURE_WEBAPP_PUBLISH_USERNAME secret exists"
          env: 
            super_secret: ${{ secrets.AZURE_WEBAPP_PUBLISH_USERNAME }}
          if: ${{ env.super_secret == '' }}
          run: 'echo "echo the secret \"AZURE_WEBAPP_PUBLISH_USERNAME\" has not been made; echo please go to \"settings \> Actions secrets and variables \> actions\" to create it"; exit 1;'
    
        - name: "Check if WEBAPI_PROJECT_NAME secret exists"
          env: 
            super_secret: ${{ secrets.WEBAPI_PROJECT_NAME }}
          if: ${{ env.super_secret == '' }}
          run: 'echo "echo the secret \"WEBAPI_PROJECT_NAME\" has not been made; echo please go to \"settings \> Actions secrets and variables \> actions\" to create it"; exit 1;'
        
  build:

    runs-on: ubuntu-latest
    needs: check
    steps:
    
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{env.DOTNET_CORE_VERSION}}

    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore
    
    - name: Test
      run: dotnet test --no-build --verbosity normal
    
    - name: Publish
      run: dotnet publish ./${{ secrets.WEBAPI_PROJECT_NAME }} --output ${{env.PUBLISH_DIRECTORY}} --configuration Release 
    
    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.PUBLISH_DIRECTORY}}

  deploy:
    runs-on: ubuntu-latest
    needs: [check, build]
    steps:

    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.PUBLISH_DIRECTORY}}

     # Deploy to Azure Web apps
    - name: 'Deploy to Azure App Service'
      uses: azure/webapps-deploy@v3
      with: 
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: <publishData><publishProfile profileName="${{secrets.AZURE_WEBAPP_NAME}} - Zip Deploy" publishMethod="ZipDeploy" publishUrl="${{ secrets.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net:443" userName="${{ secrets.AZURE_WEBAPP_PUBLISH_USERNAME }}" userPWD="${{ secrets.AZURE_WEBAPP_PUBLISH_PASSWORD }}" destinationAppUrl="http://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net" SQLServerDBConnectionString="" mySQLDBConnectionString="" hostingProviderForumLink="" controlPanelLink="https://portal.azure.com" webSystem="WebSites"><databases /></publishProfile></publishData>
        package: '${{ env.PUBLISH_DIRECTORY}}'
  
  automated-api-tests:
    runs-on: ubuntu-latest
    needs: [check, build, deploy]
    steps:
      - uses: actions/checkout@v4
      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
      - name: Run API tests
        run: |
          attempts=0
          max_attempts=3
          success=false
          failed=false  # Ensure failed is initialized to false
          
          while [ $attempts -lt $max_attempts ]; do
            echo "Attempt $((attempts+1)) of $max_attempts"
            
            # Run your Postman tests
            postman collection run 28008990-423d008b-306f-4f20-a77c-370844bfd35a -e 28008990-e67e2515-4a08-4530-8643-e58e5078bd89 -i 28008990-b352af28-2c64-424c-826b-deeea29e9385 -i 28008990-188d5d26-3744-4a3d-849e-591fcf1c9cce -i 28008990-b152664d-6139-4f0a-b3c8-f5ec86f063bd -i 28008990-47f31d7d-13fa-4a0e-aeb1-eca3cc16707f -i 28008990-36ff914c-d594-4d6e-9547-d574b4defc9c -i 28008990-1d625002-ac0f-4c0e-ab64-d3757a6701a5 -i 28008990-62dca0e6-32dc-44e1-a249-d791239719c7 -i 28008990-347d2c5e-a0fc-498c-90b1-dccb7bc51026 -i 28008990-14efc062-e424-4233-94f4-9c4f7af1b103 -i 28008990-6c30edf6-6186-4c9e-a1a1-aca4e8f39879 -i 28008990-e64ddea2-3f73-49b5-9c00-773c674a4bc8 -i 28008990-08d2ae99-4098-468d-a764-3f530b05d19a -i 28008990-a70267c7-5278-496e-8f0c-bbfd4b762be6 -i 28008990-72a482b7-8fd0-4fa9-a7c4-805f03ab9df2 -i 28008990-bc8d5033-0383-4743-a9e8-6c1a16c43d69 -i 28008990-2c8117b2-332e-468b-8630-a6b42a7f495d -i 28008990-b3ac742a-d05f-4d9b-8c0e-4683e3999ddd -i 28008990-03c8b809-2288-4ace-bfd3-c4df7f39ee9a -i 28008990-d345cec4-cd4d-4ead-be92-a460899af39d -i 28008990-e72fdce7-17a5-4e69-94ad-fb758910ba86 -i 28008990-d2352329-9461-4c46-b623-c8b99678d4d5 -i 28008990-981eae88-f433-4330-9861-f90372da1fb7
           
            # Check if tests failed
            if [ "$failed" == "true" ]; then
              echo "Tests failed. Retrying..."
              attempts=$((attempts + 1))
              failed=false  # Reset the failed flag for the next attempt
            else
              success=true
              break
            fi
          done
          
          if [ "$success" == "false" ]; then
            echo "API tests failed after $max_attempts attempts."
            exit 1
          else
            echo "API tests passed successfully after $attempts attempts."
          fi
